<!-- Supabase → Authentication → Emails → Templates → «Confirm signup». Subject: Підтвердіть пошту — Sushi Syndicate -->
<div style="margin:0;padding:24px 12px;background:#0D0B09;font-family:Arial,Helvetica,sans-serif;color:#EDE6DC">
  <div style="max-width:440px;margin:0 auto;background:#16130F;border:1px solid #2B2620;border-radius:14px;padding:28px 24px;text-align:center">
    <div style="font-size:30px;line-height:1">🍣</div>
    <h1 style="margin:12px 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:24px;color:#F4EFE6">Ще один крок</h1>
    <p style="margin:0 0 20px;font-size:14px;line-height:1.55;color:#B8AE9F">
      Дякуємо за реєстрацію на Sushi Syndicate! Підтвердіть пошту {{ .Email }} — і особистий кабінет буде готовий:
      історія замовлень, обране, а скоро — бонуси.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/account?confirmed=1"
       style="display:inline-block;padding:13px 26px;border-radius:999px;background:#C9A84C;color:#1A1208;text-decoration:none;font-weight:bold;font-size:14px;letter-spacing:1px">
      ПІДТВЕРДИТИ ПОШТУ
    </a>
    <p style="margin:22px 0 0;font-size:12px;line-height:1.5;color:#8C8377">
      Якщо ви не реєструвались — просто проігноруйте цей лист.
    </p>
  </div>
  <p style="margin:14px 0 0;text-align:center;font-size:11px;color:#6E665B">Sushi Syndicate · суші та роли · Тульчин</p>
</div>
